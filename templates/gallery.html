{% extends 'base.html' %}

{% block title %}Official Website of Rhyma | Gallery{% endblock %}

{% block content %}
<div class="container gallery-page" style="padding-top: 2rem; padding-bottom: 4rem;">
    <div style="text-align: center; margin-bottom: 3rem;">
        <h1 style="font-family: var(--font-heading); font-size: 2.5rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.5rem;">Gallery</h1>
        <p style="color: var(--accent-color); letter-spacing: 3px; font-size: 0.9rem; text-transform: uppercase;">Visual Journey & Studio Archives</p>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid">
        {% for img in images %}
        <button type="button" class="gallery-item" data-index="{{ loop.index0 }}"
            data-src="{{ img.url }}" data-title="{{ img.title }}" aria-label="View {{ img.title }} full screen">
            <img src="{{ img.url }}" alt="{{ img.title }}" loading="lazy" decoding="async"
                onload="this.classList.add('is-loaded')" onerror="this.classList.add('is-loaded')">
            <div class="gallery-overlay">
                <span class="gallery-overlay-title">{{ img.title }}</span>
                <span class="gallery-overlay-hint"><i class="fa-solid fa-expand"></i> View Full Screen</span>
            </div>
        </button>
        {% endfor %}
    </div>
</div>

<!-- Lightbox Modal -->
<div id="lightbox-modal" role="dialog" aria-modal="true" aria-label="Image viewer" aria-hidden="true">
    <button type="button" class="lightbox-btn lightbox-close" aria-label="Close">&times;</button>
    <button type="button" class="lightbox-btn lightbox-prev" aria-label="Previous image"><i class="fa-solid fa-chevron-left"></i></button>
    <button type="button" class="lightbox-btn lightbox-next" aria-label="Next image"><i class="fa-solid fa-chevron-right"></i></button>
    <figure class="lightbox-figure">
        <div class="lightbox-spinner" aria-hidden="true"></div>
        <img id="lightbox-img" src="" alt="">
        <figcaption>
            <span id="lightbox-title"></span>
            <span id="lightbox-counter"></span>
        </figcaption>
    </figure>
</div>

<style>
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.8rem;
}
.gallery-item {
    position: relative;
    display: block;
    width: 100%;
    height: 380px;
    padding: 0;
    border: none;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    background: var(--secondary-bg);
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 12px;
    opacity: 0;
    transition: transform 0.4s ease, opacity 0.5s ease;
}
.gallery-item img.is-loaded {
    opacity: 1;
}
.gallery-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 60%, rgba(0,0,0,0) 100%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 1.2rem;
    opacity: 0;
    transition: opacity 0.3s ease;
    border-radius: 12px;
    text-align: left;
}
.gallery-overlay-title {
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
    font-family: var(--font-heading);
}
.gallery-overlay-hint {
    color: var(--accent-color);
    font-size: 0.8rem;
    letter-spacing: 1px;
    margin-top: 4px;
}
.gallery-item:hover,
.gallery-item:focus-visible {
    transform: translateY(-6px);
    box-shadow: 0 12px 25px rgba(197, 160, 89, 0.25);
    outline: none;
}
.gallery-item:hover img,
.gallery-item:focus-visible img {
    transform: scale(1.05);
}
.gallery-item:hover .gallery-overlay,
.gallery-item:focus-visible .gallery-overlay {
    opacity: 1;
}
@media (hover: none) {
    .gallery-overlay { opacity: 1; background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 45%); }
    .gallery-overlay-hint { display: none; }
}

#lightbox-modal {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem;
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(8px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0s linear 0.25s;
}
#lightbox-modal.is-open {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.25s ease;
}
.lightbox-figure {
    position: relative;
    max-width: 90vw;
    max-height: 90vh;
    text-align: center;
    min-width: 120px;
    min-height: 120px;
}
#lightbox-img {
    max-width: 100%;
    max-height: 80vh;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: opacity 0.25s ease;
}
#lightbox-modal.is-busy #lightbox-img {
    opacity: 0.25;
}
.lightbox-spinner {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    margin: -22px 0 0 -22px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent-color);
    animation: loader-spin 0.8s linear infinite;
    display: none;
}
#lightbox-modal.is-busy .lightbox-spinner {
    display: block;
}
.lightbox-figure figcaption {
    display: flex;
    justify-content: center;
    gap: 1rem;
    align-items: baseline;
    margin-top: 1rem;
    color: #fff;
}
#lightbox-title {
    font-family: var(--font-heading);
    font-size: 1.2rem;
    letter-spacing: 1px;
}
#lightbox-counter {
    font-size: 0.85rem;
    opacity: 0.6;
}
.lightbox-btn {
    position: absolute;
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    z-index: 10000;
    opacity: 0.8;
    transition: opacity 0.2s ease, color 0.2s ease;
}
.lightbox-btn:hover,
.lightbox-btn:focus-visible {
    opacity: 1;
    color: var(--accent-color);
}
.lightbox-close {
    top: 1.5rem;
    right: 2rem;
    font-size: 2.5rem;
    line-height: 1;
}
.lightbox-prev,
.lightbox-next {
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.8rem;
    padding: 1rem;
}
.lightbox-prev { left: 1rem; }
.lightbox-next { right: 1rem; }
@media (max-width: 600px) {
    .lightbox-prev, .lightbox-next { top: auto; bottom: 1rem; transform: none; }
}
</style>

<script>
(function () {
    var items = Array.prototype.slice.call(document.querySelectorAll('.gallery-item'));
    var modal = document.getElementById('lightbox-modal');
    var img = document.getElementById('lightbox-img');
    var titleElem = document.getElementById('lightbox-title');
    var counterElem = document.getElementById('lightbox-counter');
    var current = 0;
    var lastFocused = null;
    var touchStartX = null;

    function show(index) {
        current = (index + items.length) % items.length;
        var item = items[current];
        modal.classList.add('is-busy');
        img.onload = function () { modal.classList.remove('is-busy'); };
        img.onerror = function () { modal.classList.remove('is-busy'); };
        img.src = item.dataset.src;
        img.alt = item.dataset.title;
        titleElem.textContent = item.dataset.title;
        counterElem.textContent = (current + 1) + ' / ' + items.length;
        if (img.complete && img.naturalWidth) modal.classList.remove('is-busy');
    }

    function open(index) {
        lastFocused = document.activeElement;
        show(index);
        modal.classList.add('is-open');
        modal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        modal.querySelector('.lightbox-close').focus();
    }

    function close() {
        if (!modal.classList.contains('is-open')) return;
        modal.classList.remove('is-open');
        modal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        if (lastFocused) lastFocused.focus();
    }

    items.forEach(function (item) {
        item.addEventListener('click', function () { open(parseInt(item.dataset.index, 10)); });
    });

    modal.querySelector('.lightbox-close').addEventListener('click', close);
    modal.querySelector('.lightbox-prev').addEventListener('click', function () { show(current - 1); });
    modal.querySelector('.lightbox-next').addEventListener('click', function () { show(current + 1); });

    modal.addEventListener('click', function (e) {
        if (e.target === modal) close();
    });

    modal.addEventListener('touchstart', function (e) {
        touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });

    modal.addEventListener('touchend', function (e) {
        if (touchStartX === null) return;
        var dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
        touchStartX = null;
    });

    document.addEventListener('keydown', function (e) {
        if (!modal.classList.contains('is-open')) return;
        if (e.key === 'Escape') close();
        else if (e.key === 'ArrowRight') show(current + 1);
        else if (e.key === 'ArrowLeft') show(current - 1);
    });

    // Cached images can finish before the inline onload handler is attached.
    items.forEach(function (item) {
        var thumb = item.querySelector('img');
        if (thumb.complete && thumb.naturalWidth) thumb.classList.add('is-loaded');
    });
})();
</script>
{% endblock %}
