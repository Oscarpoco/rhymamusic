{% extends 'base.html' %}

{% block title %}Official Website of Rhyma | Contact{% endblock %}

{% block content %}
<section class="container" style="max-width: 800px; padding: 4rem 2rem; text-align: center;">
    <h1>Get in Touch</h1>
    <p style="margin-bottom: 3rem; color: #666;">For general inquiries, press, and collaborations.</p>

    <form id="contactForm" onsubmit="handleContactSubmit(event)" style="text-align: left;">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" maxlength="100" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" maxlength="150" required>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" maxlength="3000" required></textarea>
        </div>

        <button type="submit">Send Message</button>
    </form>

    <script>
        function handleContactSubmit(event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!name || !email || !message) {
                showCustomAlert('Missing Fields', 'Please fill in all fields.');
                return;
            }

            openMailDraft(
                'enquiries@rhymamusic.co.za',
                `Inquiry from ${name}`,
                `Name: ${name}\nEmail: ${email}\n\nMessage:\n${message}`
            );

            showCustomAlert('Almost Done', 'Your email app should now open with your message ready. Just press send to reach us at enquiries@rhymamusic.co.za.');
            document.getElementById('contactForm').reset();
        }
    </script>

    <div style="margin-top: 4rem;">
        <h3>Connect</h3>
        <div class="social-icons" style="justify-content: center; display: flex; gap: 1rem; margin-top: 1rem;">
            <a href="https://x.com/rhymangn" target="_blank" rel="noopener" title="X" aria-label="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://music.apple.com/us/artist/rhyma/1232075857" target="_blank" rel="noopener" title="Apple Music" aria-label="Apple Music"><i
                    class="fa-brands fa-apple"></i></a>
            <a href="https://www.tiktok.com/@rhymangn" target="_blank" rel="noopener" title="TikTok" aria-label="TikTok"><i
                    class="fa-brands fa-tiktok"></i></a>
            <a href="https://www.instagram.com/rhymangn" target="_blank" rel="noopener" title="Instagram" aria-label="Instagram"><i
                    class="fa-brands fa-instagram"></i></a>
            <a href="https://youtube.com/rhymangn" target="_blank" rel="noopener" title="YouTube" aria-label="YouTube"><i
                    class="fa-brands fa-youtube"></i></a>
            <a href="https://open.spotify.com/search/RHYMA" target="_blank" rel="noopener" title="Spotify" aria-label="Spotify"><i
                    class="fa-brands fa-spotify"></i></a>
        </div>
    </div>
</section>
{% endblock %}
