{% extends 'base.html' %}

{% block title %}Official Website of Rhyma | Bookings{% endblock %}

{% block content %}
<section class="container" style="max-width: 800px; padding: 4rem 2rem;">
    <h1 style="text-align: center; margin-bottom: 3rem;">Bookings & Inquiries</h1>
    <p style="margin-bottom: 3rem; color: #666;">For bookings, appearances, and features.</p>

    <form id="bookingForm" onsubmit="handleBookingSubmit(event)" class="booking-form">
        <div class="form-group">
            <label for="contact_person">Contact Person / Promoter</label>
            <input type="text" id="contact_person" name="contact_person" required>
        </div>

        <div class="form-group">
            <label for="event_date">Event Date</label>
            <input type="date" id="event_date" name="event_date" required>
        </div>

        <div class="form-group">
            <label for="venue_name">Venue Name & Location</label>
            <input type="text" id="venue_name" name="venue_name" required>
        </div>

        <div class="form-group">
            <label for="budget">Budget Offer (ZAR)</label>
            <input type="number" id="budget" name="budget" placeholder="e.g. 50000" min="0" step="any" required>
        </div>

        <div class="form-group">
            <label for="details">Additional Details</label>
            <textarea id="details" name="details" rows="5"></textarea>
        </div>

        <button type="submit"><i class="hgi hgi-stroke hgi-calendar-03" aria-hidden="true"></i> Submit Inquiry</button>
    </form>

    <script>
        (function () {
            const dateInput = document.getElementById('event_date');
            const today = new Date();
            today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
            dateInput.min = today.toISOString().split('T')[0];
        })();

        function handleBookingSubmit(event) {
            event.preventDefault();

            const contactPerson = document.getElementById('contact_person').value.trim();
            const eventDate = document.getElementById('event_date').value;
            const venueName = document.getElementById('venue_name').value.trim();
            const budget = document.getElementById('budget').value;
            const details = document.getElementById('details').value.trim();

            if (!contactPerson || !eventDate || !venueName || !budget) {
                showCustomAlert('Missing Fields', 'Please fill in all required fields.');
                return;
            }

            openMailDraft(
                'bookings@rhymamusic.co.za',
                `Booking Inquiry: ${eventDate} @ ${venueName}`,
                `Contact Person: ${contactPerson}\nEvent Date: ${eventDate}\nVenue: ${venueName}\nBudget: R${budget}\n\nDetails:\n${details}`
            );

            showCustomAlert('Almost Done', 'Your email app should now open with your booking inquiry ready. Just press send to reach us at bookings@rhymamusic.co.za.');
            document.getElementById('bookingForm').reset();
        }
    </script>
</section>
{% endblock %}
