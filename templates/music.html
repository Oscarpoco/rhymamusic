{% extends 'base.html' %}

{% block title %}Official Website of Rhyma | Music{% endblock %}

{% block content %}
<div class="container music-page">
    <header class="page-header">
        <h1>Music</h1>
        <p class="page-subtitle">Stream The Sound Of Luxury</p>
    </header>

    <!-- 1. Top Performing -->
    <section class="top-tracks">
        <h2>Top Tracks</h2>
        <div class="spotify-embed-container"
            style="display: flex; flex-direction: column; gap: 1rem; align-items: center;">
            <!-- Medusa -->
            <iframe style="border-radius:12px"
                src="https://open.spotify.com/embed/track/2tYZv2w593ANPrz1HZhp55?utm_source=generator&theme=0"
                width="100%" height="152" frameBorder="0" allowfullscreen=""
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"></iframe>
            <!-- I'm Calling (Reverted to Album Embed) -->
            <iframe style="border-radius:12px"
                src="https://open.spotify.com/embed/album/0u14DjLpxYnzJzHdnV1Ez1?utm_source=generator&theme=0"
                width="100%" height="152" frameBorder="0" allowfullscreen=""
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"></iframe>
            <!-- Stamina (User Provided Track Link) -->
            <iframe style="border-radius:12px"
                src="https://open.spotify.com/embed/track/3b3VmMwvuKGPDNcUdYmLBh?utm_source=generator&theme=0"
                width="100%" height="152" frameBorder="0" allowfullscreen=""
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"></iframe>
        </div>
    </section>

    <!-- 2. Latest Release -->
    <section class="latest-release-highlight">
        <h2>Latest EP</h2>
        <div class="spotify-embed-container" style="display: flex; justify-content: center;">
            <iframe style="border-radius:12px; max-width:660px;"
                src="https://embed.music.apple.com/us/album/afro-noir-ep/6784176778" width="100%"
                height="450" frameBorder="0" allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write"
                loading="lazy"></iframe>
        </div>
    </section>

    <!-- 3. Upcoming/Unreleased (Hype) -->
    <section class="hype-section">
        <h2>Upcoming Drop</h2>
        <div class="countdown-container">
            <p class="hype-text" id="drop-announcement">Next Single Drops In:</p>
            <div id="countdown-timer" class="countdown-display">
                <!-- Timer will be injected here -->
            </div>

            <form id="waitlistForm" class="presave-form" onsubmit="handleWaitlistSubmit(event)">
                <input type="email" name="email" placeholder="Enter your email to join the waitlist" required
                    autocomplete="email">
                <button type="submit"><i class="hgi hgi-stroke hgi-notification-01" aria-hidden="true"></i> Notify
                    Me</button>
            </form>
        </div>
    </section>

</div>
{% endblock %}

{% block scripts %}
<script>
function handleWaitlistSubmit(event) {
    event.preventDefault();
    const form = event.target;
    const email = form.elements.email.value.trim();
    if (!email) return;

    openMailDraft(
        'newrelease@rhymamusic.co.za',
        'Join the Waitlist: Next Rhyma Single',
        `Hi Rhyma Team,\n\nPlease add me to the waitlist for the next release.\n\nEmail: ${email}\n\nThanks!`
    );
    showCustomAlert('Almost Done', 'Your email app should now open with your waitlist request ready. Just press send to join.');
    form.reset();
}

document.addEventListener('DOMContentLoaded', function() {
    // Array of upcoming drop dates (March 6th, 13th, 20th, 27th, 2026)
    const dropDates = [
        new Date("2026-03-06T00:00:00+02:00").getTime(),
        new Date("2026-03-13T00:00:00+02:00").getTime(),
        new Date("2026-03-20T00:00:00+02:00").getTime(),
        new Date("2026-03-27T00:00:00+02:00").getTime()
    ];

    const timerElement = document.getElementById("countdown-timer");
    const announcementElement = document.getElementById("drop-announcement");

    let timerId = null;

    function updateTimer() {
        const now = new Date().getTime();
        
        // Find the next upcoming drop date
        let nextDrop = dropDates.find(date => date > now);

        if (!nextDrop) {
            timerElement.innerHTML = '<div class="count-done"><i class="hgi hgi-stroke hgi-checkmark-circle-02" aria-hidden="true"></i> All March singles have dropped!</div>';
            announcementElement.innerText = "The Drops Are Complete";
            if (timerId) clearInterval(timerId);
            return false;
        }

        const distance = nextDrop - now;

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        const pad = n => n.toString().padStart(2, '0');
        timerElement.innerHTML = [
            [days, 'Days'], [pad(hours), 'Hours'], [pad(minutes), 'Minutes'], [pad(seconds), 'Seconds']
        ].map(([value, label]) =>
            `<div class="count-box"><span class="count-value">${value}</span><span class="count-label">${label}</span></div>`
        ).join('');
    }

    // Update timer immediately, then every second
    if (updateTimer() !== false) {
        timerId = setInterval(updateTimer, 1000);
    }
});
</script>
{% endblock %}
